[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eml2pst"
version = "1.0.0"
description = "Convert EML files and directory trees to Outlook PST files, in pure Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
eml2pst = "eml2pst.cli:main"

[tool.setuptools.packages.find]
include = ["eml2pst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
