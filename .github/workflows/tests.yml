name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # readpst (libpst) is the independent reader the round-trip tests check against.
      - run: sudo apt-get update && sudo apt-get install -y pst-utils
      - run: pip install -e ".[test]"
      - run: pytest -v
